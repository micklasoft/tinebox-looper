<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tinebox Loop">
<title>Tinebox Loop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600;700&family=Doto:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{
  --body:#E2E4E0; --body-2:#D3D6D1; --panel:#EDEEEA; --line:#C6CAC3; --key:#FFFFFF; --key-edge:#B5BAB2; --key-down:#E9EEF8;
  --ink:#1A1E21; --ink-2:#5E666B; --screen:#000; --scr-ink:#DDF1FF; --scr-dim:#7B95A3;
  --rec:#D5362B; --go:#2E66D6; --ok:#2F8A5E; --warn:#B9791A; --syn:#C9503F; --drm:#A87A0C; --gtr:#7458CF; --focus:#2E66D6;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{ --body:#1C1F21; --body-2:#141719; --panel:#25292B; --line:#3A4043; --key:#32373A; --key-edge:#0E1012; --key-down:#2A3240; --ink:#E8EBE7; --ink-2:#A0A7A3; --scr-dim:#6F8A99; --go:#5B8CF0; --gtr:#8E74E2; --syn:#D9604F; --drm:#B88A14; color-scheme:dark; }
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%}
body{height:100%;margin:0;color:var(--ink);background:var(--body);font-family:'Barlow Semi Condensed','Arial Narrow',system-ui,sans-serif;font-size:16px;line-height:1.3;
  overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
select,input{font:inherit;font-size:16px;color:var(--ink)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
#app{height:100%;display:flex;flex-direction:column;max-width:640px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 8px) 12px 0}
.panel{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:6px 0 12px;-webkit-overflow-scrolling:touch}
.dot{font-family:'Doto',ui-monospace,monospace;font-weight:900}

/* the header: session tempo, position, what is happening */
.screen{flex:none;background:var(--screen);color:var(--scr-ink);border-radius:14px;padding:10px 14px 10px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px}
#scTitle{font-size:24px;font-weight:700;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
#scState{grid-column:1/3;font-size:16px;font-weight:600;line-height:1.2;min-height:19px}
#scSmall{grid-column:1/3;font-size:14px;color:var(--scr-dim);min-height:17px}
#scPos{font-size:26px;line-height:1;align-self:center;text-align:right;white-space:nowrap}
#scPos.rec{color:#ff6a5e}
.ring{grid-column:1/3;height:6px;border-radius:3px;background:#1A2025;overflow:hidden;margin-top:6px;position:relative}
.ring i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--scr-ink);opacity:.8}
.chips{grid-column:1/3;display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;font-size:13px}
.chip{border:1px solid #2C353B;border-radius:999px;padding:1px 8px;color:var(--scr-dim)}
.chip.on{color:var(--scr-ink);border-color:var(--scr-ink)}
.chip.rec{color:#fff;background:#C93A3A;border-color:#C93A3A}
.chip.bad{color:#ff8a7e;border-color:#ff8a7e}

/* tabs */
.tabs{flex:none;display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:6px 0 calc(env(safe-area-inset-bottom,0px) + 6px);border-top:1px solid var(--line);background:var(--body)}
.tabs button{border:0;background:transparent;border-radius:10px;padding:9px 2px;font-size:17px;font-weight:600;color:var(--ink-2)}
.tabs button[aria-selected="true"]{background:var(--panel);color:var(--ink)}

/* Arrange: the timeline (sections across, tracks down) and the transport */
#pArr{display:flex;flex-direction:column;overflow:hidden;padding-bottom:8px}
.tl{flex:1;min-height:220px;position:relative;margin-top:8px;border-radius:12px;background:#0F1214;overflow:hidden}
.tlsc{position:absolute;inset:0;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;touch-action:pan-x}
.tlsc canvas{display:block}
.tlempty{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;gap:10px;padding:18px;color:#C9D2D6;font-size:16px;line-height:1.35;background:#0F1214}
.tlempty b{color:#F2C14E}
.tlempty .btn{align-self:flex-start}
.tr{flex:none;display:grid;grid-template-columns:auto 1fr auto auto auto 1fr auto;align-items:center;gap:8px;margin-top:8px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px 10px}
.tbtn{width:48px;height:48px;border-radius:12px;border:1px solid var(--key-edge);background:var(--key);display:flex;align-items:center;justify-content:center;padding:0}
.tbtn.big{width:60px;height:56px;border-radius:14px}
.tbtn svg{width:24px;height:24px;fill:currentColor}
.tbtn.big svg{width:30px;height:30px}
.tbtn.on{background:var(--go);border-color:var(--go);color:#fff}
.tbtn[aria-pressed="true"]{background:var(--ink);color:var(--body);border-color:var(--ink)}
.tbtn:disabled{opacity:.35}
.seg{display:flex;border:1px solid var(--key-edge);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--key);padding:7px 10px;font-weight:700;font-size:14px;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--body)}
.sp{min-width:0}
/* the section sheet */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:44;max-height:78vh;overflow-y:auto;background:var(--panel);border-top:1px solid var(--line);border-radius:18px 18px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.3);padding:12px 14px calc(env(safe-area-inset-bottom,0px) + 14px)}
.sheet .wrap{max-width:640px;margin:0 auto}
.sheet .hd{display:flex;align-items:center;gap:8px}
.sheet .hd h3{flex:1;margin:0;font-size:19px}
.tgrp{border-top:2px solid var(--line);margin-top:8px;padding-top:4px}
.tgrp .layer{border-top:0}
.row.lvl{margin-top:-2px}
.gv{min-width:58px;text-align:right;font-variant-numeric:tabular-nums;font-size:14px;color:var(--ink-2)}
/* Sounds */
.snd{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0}
.snd button{border:1px solid var(--key-edge);background:var(--key);border-radius:10px;padding:10px 4px;font-weight:700;font-size:15px}
.snd button[aria-pressed="true"]{background:var(--syn);border-color:var(--syn);color:#fff}
.snd button.raw[aria-pressed="true"]{background:var(--gtr);border-color:var(--gtr)}

/* switches: the footswitch mirrored on screen (no longer shown: build 5) */
.sw{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.sw button{min-height:68px;border-radius:14px;border:1px solid var(--key-edge);background:var(--key);box-shadow:0 2px 0 var(--key-edge);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px 4px}
.sw button:active{transform:translateY(1px);box-shadow:0 1px 0 var(--key-edge);background:var(--key-down)}
.sw b{font-size:17px}
.sw small{font-size:12px;color:var(--ink-2)}
.sw button.flash{background:var(--key-down)}
.sw button.on{border-color:var(--rec);box-shadow:0 2px 0 var(--rec);color:var(--rec)}
.sw .n{font-size:11px;color:var(--ink-2);font-weight:700}

.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin:10px 0}
.card h3{margin:0 0 6px;font-size:17px}
.note{font-size:14px;color:var(--ink-2);margin:6px 0}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:6px 0}
.row .lbl{flex:1;min-width:120px}
.btn{border:1px solid var(--key-edge);background:var(--key);border-radius:10px;padding:7px 12px;font-weight:600;font-size:15px}
.btn.sm{padding:4px 9px;font-size:14px}
.btn.pri{background:var(--go);border-color:var(--go);color:#fff}
.btn.rec{background:var(--rec);border-color:var(--rec);color:#fff}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--body);border-color:var(--ink)}
select{border:1px solid var(--key-edge);background:var(--key);border-radius:8px;padding:5px 8px}
input[type=range]{flex:1;min-width:120px}

/* layers */
.layer{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.layer:first-of-type{border-top:0}
.ltag{font-size:12px;font-weight:700;color:#fff;border-radius:6px;padding:2px 7px}
.ltag.gtr{background:var(--gtr)} .ltag.syn{background:var(--syn)} .ltag.drm{background:var(--drm)}
.lst{font-size:14px;color:var(--ink-2)}
.lst.pend{color:var(--warn);font-weight:700}
.lst.tape{color:var(--ok)}
.lact{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.lopt{grid-column:2/4;display:flex;gap:6px;flex-wrap:wrap;align-items:center}

/* pads */
.pads{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0}
.pad{aspect-ratio:1/0.62;border-radius:16px;border:1px solid var(--key-edge);background:var(--key);box-shadow:0 3px 0 var(--key-edge);font-size:17px;font-weight:700;touch-action:none}
.pad.hit{background:var(--key-down);transform:translateY(2px);box-shadow:0 1px 0 var(--key-edge)}

/* sections */
.sec{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 10px;align-items:center}
.sec .let{font-size:30px;line-height:1;width:40px;text-align:center}
.sec.cur{outline:2px solid var(--go);outline-offset:-1px}
.sec .sum{font-size:14px;color:var(--ink-2)}
.sec .acts{grid-column:1/4;display:flex;gap:6px;flex-wrap:wrap}

/* count-in and test banner */
.count-big{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Doto',ui-monospace,monospace;font-weight:900;font-size:40vw;color:var(--rec);pointer-events:none;z-index:40;text-shadow:0 0 30px rgba(0,0,0,.25)}
.banner{position:fixed;left:8px;right:8px;bottom:calc(env(safe-area-inset-bottom,0px) + 64px);z-index:50;background:#111;color:#F3F5F2;border-radius:16px;padding:14px 16px;box-shadow:0 8px 30px rgba(0,0,0,.35);pointer-events:none;max-width:624px;margin:0 auto}
.banner b{display:block;font-size:22px;line-height:1.2}
.banner span{display:block;font-size:15px;color:#C9D2D6;margin-top:4px}
.banner .bt{font-family:'Doto',ui-monospace,monospace;font-weight:900;font-size:26px;color:#9fd1ff;margin-top:6px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 70px);background:var(--ink);color:var(--body);padding:9px 14px;border-radius:12px;font-size:15px;z-index:60;max-width:92vw;pointer-events:none;opacity:0;transition:opacity .2s}
#toast.on{opacity:1}
.diag{position:fixed;inset:0;background:var(--body);z-index:45;overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 120px}
.diag .wrap{max-width:640px;margin:0 auto}
.diag h2{margin:4px 0 8px}
.dgres{font-size:14px;white-space:pre-wrap;color:var(--ink-2);margin:6px 0;font-family:ui-monospace,Menlo,monospace}
.meterbar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;flex:1;min-width:100px}
.meterbar i{display:block;height:100%;width:0;background:var(--ok)}
textarea.copy{width:100%;height:120px;font-size:12px}
</style>

<body>
<div id="app">
  <div class="screen" aria-live="polite">
    <div id="scTitle">Tinebox Loop</div>
    <div id="scPos" class="dot">–</div>
    <div id="scState"></div>
    <div id="scSmall">Connect the TP-7 (Settings), then tap switch 6 four times for a session.</div>
    <div class="ring" aria-hidden="true"><i id="scRing"></i></div>
    <div class="chips" id="scChips"></div>
  </div>
  <main class="panel" id="pArr"></main>
  <main class="panel" id="pSnd" hidden></main>
  <main class="panel" id="pSet" hidden></main>
  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="Arr" aria-selected="true">Arrange</button>
    <button role="tab" data-tab="Snd" aria-selected="false">Sounds</button>
    <button role="tab" data-tab="Set" aria-selected="false">Settings</button>
  </nav>
</div>
<div id="toast" role="status"></div>
<div class="sheet" id="sheet" hidden role="dialog" aria-label="Section"><div class="wrap" id="sheetIn"></div></div>
<script>
// Guitar to synth DSP for Tinebox Loop. One self-contained factory, so the same code runs in the audio worklet (live preview),
// in a worker (the exact version printed to tape) and in Node (offline tests). No DOM, no Web Audio.
function GDSP(){
'use strict';
const TAU=2*Math.PI, mtof=m=>440*Math.pow(2,(m-69)/12), ftom=f=>69+12*Math.log2(f/440);

function fft(re,im){ const n=re.length;
  for(let i=1,j=0;i<n;i++){ let b=n>>1; for(;j&b;b>>=1) j^=b; j^=b; if(i<j){ let t=re[i]; re[i]=re[j]; re[j]=t; t=im[i]; im[i]=im[j]; im[j]=t; } }
  for(let len=2;len<=n;len<<=1){ const a=-TAU/len, wr=Math.cos(a), wi=Math.sin(a), h=len>>1;
    for(let i=0;i<n;i+=len){ let cr=1, ci=0; for(let k=0;k<h;k++){ const p=i+k, q=p+h, tr=re[q]*cr-im[q]*ci, ti=re[q]*ci+im[q]*cr; re[q]=re[p]-tr; im[q]=im[p]-ti; re[p]+=tr; im[p]+=ti; const nr=cr*wr-ci*wi; ci=cr*wi+ci*wr; cr=nr; } } } }

// ------------------------------------------------------------------ decimation to about 24 kHz
// a 4th-order Butterworth low-pass (two biquads) at 9.5 kHz, then every D-th sample
function Decim(srIn,target){ const D=Math.max(1,Math.round(srIn/(target||24000))); this.D=D; this.sr=srIn/D; this.ph=0; this.z=new Float64Array(8);
  const fc=Math.min(9500,0.4*this.sr), w0=TAU*fc/srIn, cw=Math.cos(w0), sw=Math.sin(w0);
  this.c=[0.5412,1.3066].map(Q=>{ const al=sw/(2*Q), a0=1+al; return [(1-cw)/2/a0,(1-cw)/a0,(1-cw)/2/a0,-2*cw/a0,(1-al)/a0]; }); }
Decim.prototype.run=function(x,n,out,o){ const D=this.D, z=this.z, c=this.c; let k=o;
  if(D===1){ for(let i=0;i<n;i++) out[k++]=x[i]; return k-o; }
  for(let i=0;i<n;i++){ let v=x[i];
    for(let s=0;s<2;s++){ const b=c[s], j=4*s, y=b[0]*v+b[1]*z[j]+b[2]*z[j+1]-b[3]*z[j+2]-b[4]*z[j+3]; z[j+1]=z[j]; z[j]=v; z[j+3]=z[j+2]; z[j+2]=y; v=y; }
    if(this.ph===0) out[k++]=v; this.ph=(this.ph+1)%D; }
  return k-o; };

// ------------------------------------------------------------------ the multi-pitch tracker: which notes sound now, and how loud
// Per frame: spectral peaks (parabolic interpolation on the log magnitude), then pitches one at a time by harmonic salience (the sum of
// weighted peaks at the harmonics of each candidate, weights after Klapuri 2006), each found pitch taking its share of its harmonics
// out of the spectrum (spectral smoothness: at most the average of its neighbouring harmonics), until what is left is too weak.
function Tracker(sr,N,o){ o=o||{}; this.sr=sr; this.N=N; this.mMin=o.mMin||38; this.mMax=o.mMax||90; this.poly=o.poly||6; this.rel=o.rel==null?0.16:o.rel; this.floor=o.floor||0.00004; this.prune=!!o.prune; this.fine=o.fine!==false; this.cand=new Int32Array(128); this.take=new Int32Array(16); this.seen=new Uint8Array(128); this.top=new Int32Array(12); this.cnt=0; this.low=0;
  const w=this.w=new Float64Array(N), skew=o.skew||0; // skew: 0 symmetric Hann; 0.75: rises over 3/4 and falls over the last 1/4 (less delay, live)
  if(!skew){ for(let i=0;i<N;i++) w[i]=0.5-0.5*Math.cos(TAU*i/(N-1)); }
  else { const R=Math.round(N*skew), F=N-R; for(let i=0;i<R;i++) w[i]=0.5-0.5*Math.cos(Math.PI*i/R); for(let i=0;i<F;i++) w[R+i]=0.5+0.5*Math.cos(Math.PI*i/F); }
  let s=0; for(let i=0;i<N;i++) s+=w[i]; this.ws=s; this.re=new Float64Array(N); this.im=new Float64Array(N); this.mag=new Float64Array(N>>1);
  this.k0=Math.max(2,Math.floor(55*N/sr)); this.k1=Math.min((N>>1)-2,Math.floor(Math.min(6000,0.45*sr)*N/sr));
  this.delay=skew?(N-Math.round(N*skew))/sr:N/2/sr; // how far the frame's weight sits before its end
  this.Pf=new Float64Array(512); this.Pa=new Float64Array(512); this.Pr=new Float64Array(512); this.np=0; }
const KW=(h)=>1/Math.pow(h,0.35);
Tracker.prototype.peaks=function(){ const m=this.mag, sr=this.sr, N=this.N, sc=2/this.ws; let mx=0;
  for(let k=this.k0;k<=this.k1;k++) if(m[k]>mx) mx=m[k];
  const thr=Math.max(this.floor/sc,mx*0.0032); let n=0; // peaks within 50 dB of the strongest
  for(let k=this.k0+1;k<this.k1&&n<512;k++){ const v=m[k]; if(v>thr&&v>m[k-1]&&v>=m[k+1]){ const a=Math.log(m[k-1]+1e-12), b=Math.log(v+1e-12), c=Math.log(m[k+1]+1e-12), den=a-2*b+c, d=den<0?0.5*(a-c)/den:0, dd=Math.max(-0.5,Math.min(0.5,d));
      this.Pf[n]=(k+dd)*sr/N; this.Pa[n]=Math.exp(b-0.25*(a-c)*dd)*sc; n++; } }
  this.np=n; return mx*sc; };
// the salience of f0 over the residual peaks, and which peak each harmonic took. Mild weights (1/h^0.35) so a low string's many
// harmonics outweigh its 4th harmonic taken as a note; a candidate missing many of its first 6 harmonics is scaled down (that rules
// out sub-octaves); a low candidate (under 140 Hz) needs its own fundamental, so a chord's common sub-harmonic is not taken as a note
Tracker.prototype.sal=function(f0,take){ const P=this.Pf, A=this.Pr, n=this.np; let s=0, cnt=0, lo=0, h1=0, mx=0, f6=0;
  const H=Math.min(12,Math.floor(Math.min(5000,0.45*this.sr)/f0)), H6=Math.min(6,H);
  for(let h=1;h<=H;h++){ const t=h*f0, tol=t*(Math.pow(2,(30+4*h)/1200)-1); while(lo<n&&P[lo]<t-tol) lo++; let best=-1, bd=1e9;
    for(let j=lo;j<n&&P[j]<=t+tol;j++){ const d=Math.abs(P[j]-t); if(A[j]>0&&d<bd){ bd=d; best=j; } }
    if(take) take[h]=best; if(best<0) continue; const g=1-0.5*(bd/tol)*(bd/tol), a=A[best]; s+=KW(h)*Math.sqrt(a)*g; cnt++; if(h<=H6) f6++; if(h===1) h1=a; if(a>mx) mx=a; }
  if(H6>0) s*=f6/H6;
  const ok=f0<140?h1>=0.02*mx&&h1>0:true;
  // results in fields, not a new object per call (the live tracker runs in the audio thread, where garbage collection pauses hurt)
  this.cnt=f0>1000?cnt+1:cnt; this.low=h1>0||(take&&take[2]>=0)||cnt>=3?1:0; return ok?s:0; };
// one frame: x[off .. off+N) at this.sr. Returns {lvl, notes:[{m, f, a}]} (a: amplitude of the note's partials)
Tracker.prototype.frame=function(x,off){ const N=this.N, re=this.re, im=this.im, w=this.w;
  for(let i=0;i<N;i++){ re[i]=x[off+i]*w[i]; im[i]=0; } fft(re,im); for(let k=0;k<N>>1;k++) this.mag[k]=Math.hypot(re[k],im[k]);
  const lvl=this.peaks(), out=[]; if(lvl<this.floor||this.np<1) return {lvl,notes:out};
  for(let j=0;j<this.np;j++) this.Pr[j]=this.Pa[j];
  let first=0; const take=this.take;
  // candidates: every pitch in range, or (prune, live) only those whose 1st, 2nd or 3rd harmonic is one of the 12 strongest peaks
  let nc=0; const C=this.cand;

  L.push(pm&&dir==='in'?{t:Math.round(t),s:'in  '+txt,run:true,first:pm[1],n:1}:{t:Math.round(t),s:(dir==='in'?'in  ':'out ')+txt}); }

// the TP-7's own reports: position (M) every ~200 ms while the tape moves, armed (O), playing (N), file (K)
const TP={pos:null,posLog:[],arm:null,play:null,file:null,info:null,listeners:new Set(),sxlog:null,held:null};
function midiIn(ev,port){ const d=[...ev.data], now=evT(ev);
  if(/tp.?7/i.test(port)&&!/blue/i.test(port)&&d[0]===0xF0){ sxLog('in',d,now); TP.listeners.forEach(f=>{ try{ f(d,now); }catch(e){} });
    const p=sxParse(d); if(!p) return; if(p.debug){ log('err','TP-7 debug frame: '+p.text); return; }
    if(p.kind==='event'&&p.cmd===0x7F){ const v=p.v;
      if(v[0]===0x4D&&v.length>=5){ TP.pos=u32le(v,1); TP.posLog.push([now,TP.pos]); if(TP.posLog.length>3000) TP.posLog.splice(0,1500);
        if(TP.playAt!=null&&TP.firstM==null){ TP.firstM=now; log('tp',`first position ${TP.pos} ms, ${Math.round(now-TP.playAt)} ms after Play`); } }
      else if(v[0]===0x4F){ const o=TP.arm; TP.arm={v:v[1],t:now}; if(!o||o.v!==v[1]) log('tp',`armed = ${v[1]}`); }
      else if(v[0]===0x4E){ const o=TP.play; TP.play={v:v[1],t:now}; if(!o||o.v!==v[1]) log('tp',`playing = ${v[1]}`); }
      // build 13: the arrival time, so a new file can be told from the one Start Session reports (Test 5, 26 Nov: Start Session
      // always reports the newest closed file, even an old one)
      else if(v[0]===0x4B){ const f=sxFile(d); if(f){ f.t=now; TP.file=f; log('tp',`file: ${fileTxt(f)}`); } } }
    // build 13 (as build 12): the replies to Play and Stop carry the playing state (N); on the Mac the N notice came only there
    if(p.kind==='resp'&&p.cmd===0x7F&&p.v[0]===0x4E&&p.v.length>=2){ const o=TP.play; TP.play={v:p.v[1],t:now}; if(!o||o.v!==p.v[1]) log('tp',`playing = ${p.v[1]} (reply)`); }
    if(p.kind==='resp'&&p.cmd===0x01){ const o={}; asc(p.v).split(';').forEach(kv=>{ const i=kv.indexOf(':'); if(i>0) o[kv.slice(0,i).replace(/^[^a-z]+/i,'')]=kv.slice(i+1); }); if(o.product) TP.info=o; }
    return; }
  if(port&&!/tp.?7/i.test(port)) PED.midi&&PED.midi(d,port); }
async function sxAsk(cmd,payload,ms){ const q=sxReq(cmd,payload); let got=null; const f=d=>{ const p=sxParse(d); if(p&&p.kind==='resp'&&p.id===q.id) got=p; };
  TP.listeners.add(f); mNow(q.bytes); await waitFor(()=>!!got,ms||400,5); TP.listeners.delete(f); return got; }
async function sxAlive(){ const r=await sxAsk(0x01,[],900); return r?(/mode:([a-z_]+)/i.exec(asc(r.v))||[])[1]||'?':null; }
async function tpRead(op){ const r=await sxAsk(0x7F,[op],500); return r&&!r.st&&r.v.length>=2?r.v[1]:null; }
const tpEditRead=()=>tpRead(0x0b); // ff = not in edit mode, otherwise the selected track (25 Oct)
async function tpSetEdit(on){ const v=await tpEditRead(); if(v!=null&&(v!==0xff)===on) return {sent:false,after:v};
  // build 10: asks every 60 ms from 200 ms on instead of waiting 700 ms, and logs how long the TP-7 took (to learn its real time)
  // build 13 (build 12's rule, 20 Nov): reads at once and every 20 ms up to 0.9 s (the toggle took 3 to 4 ms on the Mac, 19 Nov).
  // The 80 ms margin after it is gone (build 12 had 30 ms); not tested on the TP-7: the phone tests check it.
  mNow([0xB0,14,0]); mNow(sxMsg(SXOP.edit)); const t0=performance.now(); let a=null;
  while(performance.now()-t0<900){ a=await tpEditRead(); if(a!=null&&(a!==0xff)===on) break; await sleep(20); }
  const ok=a!=null&&(a!==0xff)===on; log('st',`edit mode ${on?'on':'off'}: ${ok?'':'not seen after '}${Math.round(performance.now()-t0)} ms`); return {sent:true,after:a}; }
async function tpSel(track,input){ const a=await sxAsk(0x7F,[0x09,track],400); if(!(a&&!a.st)) return false; const b=await sxAsk(0x7F,[0x0a,input],400); if(!(b&&!b.st)) return false; TP.trk=track; TP.inp=input; return true; }
// track first, input once the track took (31 Oct: a refused track change put the input on the wrong track); wait for armed = 0 first
async function tpSelSafe(track,input){ if(TP.arm&&TP.arm.v===1){ TP.perf=false; mNow([0xB0,14,0]); } await waitFor(()=>!TP.arm||TP.arm.v===0,600,10);
  for(let i=0;i<4;i++){ if(await tpSel(track,input)){ const t=await tpRead(0x0b), n=await tpRead(0x0c); if(t===track&&n===input) return true; } await sleep(150); }
  log('err',`the TP-7 did not take track ${track+1}, ${inName(input)}`); return false; }
async function tpEditTo(track,input){ const ed=await tpSetEdit(true); if(ed.after==null) return 'The TP-7 does not answer.'; if(ed.after===0xff) return 'Edit mode did not come on.';
  return (await tpSelSafe(track,input))?'':`The TP-7 did not take track ${track+1}, ${inName(input)}.`; }
// build 13: the TP-7 sends its notices (armed, position, file) only after Start Session (Test 5, 26 Nov). Waits for the reply, not a timer.
async function tpSession(){ TP.sesAt=performance.now(); return sxAsk(0x7F,[SXOP.session],400); }
async function tpPosNow(){ TP.pos=null; mNow(sxMsg(SXOP.session)); await sleep(300); return TP.pos==null?0:TP.pos; }
async function tpFileNow(){ TP.file=null; mNow(sxMsg(SXOP.session)); await waitFor(()=>!!TP.file,1500); return TP.file; }
// back to the start: 0x4a (24 Oct: also in edit mode, where stop does not rewind; 18 of 18), checked by the position it reports
async function tpToStart(){ mNow([0xB0,14,0]); mNow(sxMsg(SXOP.stop)); await sleep(250); TP.pos=null; mNow(sxMsg(SXOP.start)); if(await waitFor(()=>TP.pos===0,500,10)) return true;
  await sleep(150); if((await tpPosNow())<=150) return true; mNow(sxMsg(SXOP.start)); await sleep(500); return (await tpPosNow())<=150; }
async function tpArm(on){ mNow([0xB0,14,on?127:0]); return waitFor(()=>TP.arm&&TP.arm.v===(on?1:0),600,10); }
async function tpAlive(){ if(R.sysex!==true) return false; if(await sxAlive()) return true; await midiConnect(); await sleep(900); return !!(await sxAlive()); }
function tpProblem(){ if(!midiReady()) return 'Connect the TP-7 first (Settings, Connect).'; if(R.sysex!==true) return 'SysEx is not allowed: reconnect and allow SysEx.'; return ''; }
const fileTxt=f=>f?`${f.path.split('/').pop()} (${(f.frames/Math.max(1,f.sr)).toFixed(2)} s, ${f.b9} track${f.b9===1?'':'s'})`:'unknown';
// a cue note: tap it (it jumps and plays while held), then stop, so the tape waits on the cue (24 Oct test 10 C)
async function tpCue(n){ mNow([0xB0,17,0]); mNow([0x90,n,100]); await sleep(90); mNow([0x80,n,0]); await sleep(150); mNow(sxMsg(SXOP.stop)); await sleep(350); }
// the performance stance: the tape standing, armed, so the guitar reaches the app (8 Oct) and nothing records.
// Build 1 used edit mode on track 1, line 1: you heard your guitar, the app heard it, but you did not hear the app (8 Nov, test 1).
// Normal mode, armed with record sources line 1, USB 1 and USB 2 should give both: the guitar reached the app while armed in normal
// mode (8 Oct), and you heard Tinebox while recording line 1 (build 42 test 15). Test 1 checks it; S.tp.stance keeps what it found.
// Never Play in this stance: in normal mode that makes a new recording (printing checks the loaded file first).
// build 9: the TP-7's line 1 gain, 0 to 42 dB, by CC 9 on channel 1 (Tinebox, 14 Oct: 10 and 30 dB sent showed +9 and +29 dB).
// A guitar straight into the TP-7 came in near -30 dBFS at the gain it had (17 Nov); with the Mustang Micro before it, near -9.
function tpGain(db){ if(db==null) return; db=Math.max(0,Math.min(42,Math.round(db))); S.tp.gain=db; save(); if(!R.midi||!R.outId) return; mNow([0xB0,9,Math.min(127,Math.ceil(db*128/42))]); log('st',`TP-7 input gain set to ${db} dB`); }
// build 13: waits for the reply to Stop instead of 120 ms (not tested on the TP-7: the phone tests check it); Start Session before
// arming, so the armed notice comes (Test 5), and again once armed, so the next take needs only Play (capStart)
async function tpPerform(){ const e=tpProblem(); if(e) return e; if(S.tp.gain!=null) tpGain(S.tp.gain); tpRelease(); mNow([0xB0,17,0]); TP.stopAt=performance.now(); await sxAsk(0x7F,[SXOP.stop],400); await tpSession();
  if(S.tp.stance==='edit'){ const r=await tpEditTo(0,TPIN.line1); if(r) return r; }
  else { const ed=await tpSetEdit(false); if(ed.after==null) return 'The TP-7 does not answer.'; if(ed.after!==0xff) return 'Edit mode did not go off.'; }
  if(!(await tpArm(true))) return 'The TP-7 did not report armed.'; await tpSession(); TP.perf=true; TP.stance=S.tp.stance; return ''; }
// a cue note held for TP-7 playback (Sections) is let go before anything else
function tpRelease(){ if(TP.held!=null){ mNow([0x80,TP.held,0]); TP.held=null; } }
async function tpUnperform(){ TP.perf=false; if(TP.arm&&TP.arm.v===0) return true; return tpArm(false); }

// ================================================================== the looper (in the app)
// S.ses: {id, bpm, file, fileEnd, cues:{note:tape s}, secs:[{id,name,bars,L,s,layers:[{id,type,state,printed,gain,muted,preset,oct}]}], cur, rt}
// E.st: idle, prep, ready (session ready, nothing yet), first (a section's first pass), loop, stopped, printing, tape (TP-7 playback)
const E={st:'idle',msg:'',small:'',play:null,next:null,rec:null,gen:0,ci:null,bufs:new Map(),raws:new Map(),busy:false};
// The first section starts 1.6 s into the TP-7 recording. Build 3 tried 0.25 s, timing those prints by the TP-7's start lag; test 2 on
// hardware (8 Nov 16:37) showed that lag moving by about 40 ms from one start to the next (two passes of A 18 ms apart). 1.6 s gives
// five position reports before the section, as in build 1 (passes within 1.1 ms). The app's TP-7 playback jumps over it with a cue.
const TAPE0=1.6, CAP=32;
const uid=()=>Math.random().toString(36).slice(2,10);
const SES=()=>S.ses, SEC=k=>S.ses&&S.ses.secs[k];
// Each section has its own tempo (build 4): a first pass is as long as your two presses, and its tempo moves to make it whole bars
// (8 Nov: "the loop needs to respect the switch, where the BPM can be shifted to match the loop if necessary").
const bpmOf=k=>{ const s=SEC(k); return s&&s.bpm||(S.ses?S.ses.bpm:100); };
const bpmNow=()=>!S.ses?100:!S.ses.secs.length?S.ses.bpm:bpmOf(E.play?E.play.k:(S.ses.cur||0));
const barS=()=>240/bpmNow(), beatS=()=>60/bpmNow();
const bpmTxt=b=>(Math.round(b*10)/10).toString();
const TRACK={gtr:0,syn:1,drm:2}, TNAME={gtr:'Guitar',syn:'Synth',drm:'Drums'};
function say(m,small){ if(m!=null&&m!==E.msg) log('say',m); if(m!=null) E.msg=m; if(small!=null) E.small=small; renderScreen(); }
const sleepTo=t=>sleep(Math.max(0,(t-ctx.currentTime)*1000));
const at=(t,f)=>setTimeout(f,Math.max(0,(t-ctx.currentTime)*1000));

// ------------------------------------------------------------------ the clock and the metronome
const CLK={on:false,z0:0,n:0,b:0.5,nz:null,nb:null,clicks:[],hist:[]};
function clkStart(z,b){ b=b||beatS(); CLK.b=b; CLK.nz=null; CLK.z0=z; CLK.n=Math.ceil((ctx.currentTime+0.02-z)/b-1e-6); clkClear(z-0.02); CLK.on=true; }
// a new tempo (and bar 1) from time z on; the clicks before z stay on the old grid
function clkRetime(z,b){ if(!CLK.on){ clkStart(z,b); return; } CLK.nz=z; CLK.nb=b; clkClear(z-0.002); CLK.n=Math.min(CLK.n,Math.ceil((z-0.002-CLK.z0)/CLK.b-1e-6)); }
function clkStop(){ CLK.on=false; clkClear(ctx?ctx.currentTime:0); }
function clkClear(after){ CLK.hist=CLK.hist.filter(c=>c.t<=after&&c.t>(ctx?ctx.currentTime:0)-200); CLK.clicks=CLK.clicks.filter(c=>{ if(c.t>after){ c.g.forEach(g=>{ try{ g.disconnect(); }catch(e){} }); return false; } return c.t>ctx.currentTime-0.3; }); }
const clkNext=t=>{ const b=CLK.b*4; return CLK.z0+Math.ceil((t-CLK.z0)/b-1e-6)*b; };
const clkNear=t=>{ const b=CLK.b*4; return CLK.z0+Math.round((t-CLK.z0)/b)*b; };
function tick(){ if(!ctx||ctx.state!=='running') return; const now=ctx.currentTime, ahead=now+0.15;
  if(CLK.on&&S.ses){ for(;;){ const t=CLK.z0+CLK.n*CLK.b;
      if(CLK.nz!=null&&t>=CLK.nz-0.002){ CLK.z0=CLK.nz; CLK.b=CLK.nb; CLK.nz=null; CLK.n=Math.max(0,Math.ceil((now+0.005-CLK.z0)/CLK.b-1e-6)); continue; }
      if(t>ahead) break; if(t>=now+0.005&&S.metroOn&&!inCount(t)){ const acc=((CLK.n%4)+4)%4===0; CLK.clicks.push({t,g:knock(t,acc)}); CLK.hist.push({t,acc}); } CLK.n++; } }
  // a drum take replays what it has so far, from the next time round
  const r=E.rec, P=E.play; if(r&&r.type==='drm'&&P){ for(const hh of r.hits){ for(;;){ const t=P.z+(hh.r+hh.n)*P.L+hh.ph; if(t>ahead) break; if(t>=now+0.005) drumV(ctx,A.pads,A.noise,DST,hh.i,t,hh.v,KITS[S.kit]); hh.n++; } } } }
// the count-in: the bar before z gets a beep on each beat still ahead in place of the knock, and a large count on screen
function countIn(z){ countOff(); const b=CLK.on?CLK.b:beatS(), c=E.ci={a:z-4*b,b:z,beat:b,g:[]}; clkClear(c.a-0.01);
  for(let i=0;i<4;i++){ const t=z-(4-i)*b; if(t<ctx.currentTime+0.03) continue; c.g.push(beep(t,i+1)); }
  // knocks already scheduled after the count-in bar must come back: let the clock reschedule from there
  CLK.n=Math.min(CLK.n,Math.ceil((c.a-0.01-CLK.z0)/CLK.b-1e-6)); }
function countOff(){ const c=E.ci; if(!c) return; c.g.forEach(g=>{ try{ g.disconnect(); }catch(e){} }); E.ci=null; }
const inCount=t=>{ const c=E.ci; return !!(c&&t>=c.a-0.01&&t<c.b-0.01); };

// ------------------------------------------------------------------ loop playback: one looping source per layer
function mkBuf(y,N){ const b=ctx.createBuffer(1,N,ctx.sampleRate), d=b.getChannelData(0); d.set(y.length>N?y.subarray(0,N):y); return b; }
function phase(t,z,L){ return ((t-z)%L+L)%L; }
function srcAdd(P,id,s){ const a=P.srcs.get(id)||[]; a.push(s); P.srcs.set(id,a); }
// a layer's level: its own slider times its track's (build 5: a level per layer and per track, for balancing; prints use the same)
const trkGain=t=>S.ses&&S.ses.tg&&S.ses.tg[t]!=null?S.ses.tg[t]:1;
function gainOf(l){ return l.muted?0:(l.gain==null?1:l.gain)*trkGain(l.type); }
// a looping source for layer l in loop P from time t (at the right phase)
function layerPlay(P,l,t){ const buf=E.bufs.get(l.id); if(!buf||!P) return; t=Math.max(t,ctx.currentTime+0.02);
  const src=ctx.createBufferSource(), g=ctx.createGain(); src.buffer=buf; src.loop=true; src.loopStart=0; src.loopEnd=buf.duration; g.gain.value=gainOf(l); src.connect(g); g.connect(A.loop);
  src.start(t,phase(t,P.z,P.L)*buf.duration/P.L); srcAdd(P,l.id,{src,g,loop:true}); }
// round 1 of a fresh loop: buffer part [p0, p1) of the loop (in seconds), played once at its place in the round starting at z
function layerOnce(P,id,buf,p0,p1,z){ const now=ctx.currentTime+0.02; let t=z+p0, off=p0; if(t<now){ off+=now-t; t=now;
    // build 13, test 1: how much of the loop's start the first repeat skips
    log('t1',`repeat starts ${((off-p0)*1000).toFixed(1)} ms into the loop (output latency ${msTxt(ctx.outputLatency)}, base ${msTxt(ctx.baseLatency)})`); } if(off>=p1) return;
  const src=ctx.createBufferSource(), g=ctx.createGain(); src.buffer=buf; src.connect(g); g.connect(A.loop); src.start(t,off,p1-off); srcAdd(P,id,{src,g}); }
function layerSilence(P,id,t,fade){ const a=P&&P.srcs.get(id); if(!a) return; t=Math.max(t,ctx.currentTime);
  a.forEach(s=>{ try{ s.g.gain.cancelScheduledValues(t); s.g.gain.setValueAtTime(s.g.gain.value,t); s.g.gain.linearRampToValueAtTime(0,t+(fade||0.01)); s.src.stop(t+(fade||0.01)+0.01); }catch(e){} }); P.srcs.delete(id); }
function loopStart(k,z){ const sec=SEC(k), P={k,z,L:sec.L,srcs:new Map()}; sec.layers.forEach(l=>layerPlay(P,l,z)); return P; }
function loopEnd(P,t){ if(!P) return; [...P.srcs.keys()].forEach(id=>layerSilence(P,id,t,0.012)); }
function layerGain(l){ const P=E.play; if(P&&P.srcs.get(l.id)) P.srcs.get(l.id).forEach(s=>{ try{ s.g.gain.setTargetAtTime(gainOf(l),ctx.currentTime,0.01); }catch(e){} }); }
async function ensureBufs(k){ const sec=SEC(k); if(!sec) return; for(const l of sec.layers){ if(E.bufs.get(l.id)) continue; const d=await IDB.get(S.ses.id+':'+l.id);
    if(d&&d.y){ const b=ctx.createBuffer(1,d.y.length,d.sr||ctx.sampleRate); b.getChannelData(0).set(d.y); E.bufs.set(l.id,b); } else log('err',`layer ${l.id}: no audio stored`); } }
function storeLayer(l,y,sr){ IDB.put(S.ses.id+':'+l.id,{y,sr}); l.env=envOf(y,160); }
function envOf(y,n){ const out=new Array(n).fill(0), m=y.length/n; for(let j=0;j<n;j++){ let p=0; for(let i=Math.floor(j*m),e=Math.floor((j+1)*m);i<e;i++){ const a=y[i]<0?-y[i]:y[i]; if(a>p) p=a; } out[j]=Math.round(p*1000)/1000; } return out; }

// ------------------------------------------------------------------ a session: a new TP-7 recording, the performance stance, the round trip
async function prepSession(bpm,tapZ){ const e=tpProblem(); if(e){ say(e); return; } initAudio(); if(!ctx) return;
  if(['prep','printing'].includes(E.st)) return; await stopAll(true); E.st='prep'; const G0=++E.gen; say(`New session at ${Math.round(bpm)} bpm: checking the TP-7…`,'');
  const gone=()=>G0!==E.gen, fail=m=>{ if(!gone()){ E.st=S.ses&&S.ses.secs.length?'stopped':'idle'; say(m); } log('err',m); return m; };
  if(!(await tpAlive())) return fail('The TP-7 does not answer over MIDI. Check the cable, then Settings, Connect.'); await tpSession();
  if(!(await openInput())) return fail('No audio input: the app cannot hear the guitar.');
  // build 11, capture: no recording to make first (the first loop or Play starts one), so only the stance and the round trip
  if(capOn()){ let rt={rt:S.tp.rt[setupKey()]!=null?S.tp.rt[setupKey()]:null,stored:true}, r;
    if(rt.rt==null){ say('New session: measuring the round trip (the first time on this audio setup)…'); await tpUnperform(); r=await tpEditTo(0,TPIN.usb1); if(r) return fail(r); await tpToStart(); await tpArm(true);
      rt=await measureRT(); await tpArm(false); if(gone()) return; if(rt.rt!=null) S.tp.rt[setupKey()]=rt.rt; else log('err',`round trip not measured (${rt.why})`); }
    r=await tpPerform(); if(r) return fail(r); if(gone()) return;
    S.ses={id:uid(),bpm:Math.round(bpm*10)/10,created:Date.now(),file:null,fileEnd:0,cues:{},secs:[],cur:0,rt:rt.rt!=null?rt.rt:RT(),capture:true,caps:[]}; save(); E.rtOK=null;
    E.bufs.clear(); E.raws.clear(); E.st='ready'; clkStart(tapZ!=null?alignBar(tapZ):clkFirst()); if(tapZ!=null&&TAP.at4!=null) log('t10',`metronome runs ${Math.round(performance.now()-TAP.at4)} ms after the fourth tap, ${S.ses.bpm} bpm`); log('st',`session ready (capture): ${S.ses.bpm} bpm, round trip ${msTxt(S.ses.rt)}${rt.stored?' (from the last session)':''}`);
    say(`Ready at ${S.ses.bpm} bpm.`,`Switch 1 starts a loop${S.len?` of ${S.len} bar${S.len>1?'s':''}`:''}; the TP-7 records from then on. Twice quickly keeps what you just played.`); renderAll(); return; }
  say(`New session at ${Math.round(bpm)} bpm: making a new TP-7 recording…`);
  // 1. half a second in normal mode with the app silent: a new recording with one track per record source (line 1, USB 1, USB 2)
  await tpUnperform(); await tpSetEdit(false); if(gone()) return; if(!(await tpToStart())) return fail('The tape did not go back to the start.');
  // 2 s (build 4): longer than the 1.6 s before section A, so the first print of A plays unarmed to 1.45 s (its timing from the position
  // reports, its cue set on the way) and arms there, as every later section does. The reports also give the start lag here.
  A.master.gain.value=0; let T=ctx.currentTime+0.5; const Pp=audioToPerf(T)+midiOffset(); midiSend([0xB0,14,127],T-0.35); midiSend(sxMsg(SXOP.session),T-0.25); midiSend(sxMsg(SXOP.play),T); midiSend(sxMsg(SXOP.stop),T+2.0); midiSend([0xB0,14,0],T+2.05);
  await sleepTo(T+2.2); A.master.gain.value=1; const xc=inSlice(T,T+2.15), cpk=xc?G.peakOf(xc):1; const lf=posFit(Pp-50,0); if(lf.n>=3){ (S.tp.lag=S.tp.lag||{}).normal=Math.round(lf.c-Pp); log('st',`start lag (normal mode): ${S.tp.lag.normal} ms`); }
  // build 13: the file closes on the disarm and its K notice follows about 40 ms later (Test 5, 26 Nov, 15 of 15): wait for it

function tlRound(c,x,y,w,h,r){ c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); }

function tlTap(x,y){ const lay=TL.lay; if(!lay||!S.ses) return; initAudio();

  const col=lay.cols.find(q=>x>=q.x&&x<q.x+q.w); if(!col) return; const k=col.k;
  if(y<lay.head) return secPick(k);

  await tpUnperform(); await tpEditTo(0,TPIN.line1); await tpToStart(); const P0=performance.now(), g0=ctx.currentTime; mNow(sxMsg(SXOP.play));
  await sleep((TAPE0+2*L+1)*1000); mNow(sxMsg(SXOP.stop)); const fit=posFit(P0,0); const ts=clicksIn(g0,ctx.currentTime-0.1);
  if(!fit.n){ dgLine(id,'✗ no position reports during playback'); return; } dgLine(id,`· playback: ${ts.length} clicks heard, ${fit.n} position reports`);
  const rows=lays.map(({k,beats},i)=>{ const sec=ses.secs[k], offs=[]; for(const b of beats){ const want=sec.s+b*beatS(); const t=ts.find(t=>{ const p=(h2p(t-RT())-fit.c)/1000; return Math.abs(p-want)<0.12; }); if(t!=null) offs.push((h2p(t-RT())-fit.c)/1000-want); } return {i,n:offs.length,of:beats.length,med:offs.length?medOf(offs):null,sp:offs.length?Math.max(...offs)-Math.min(...offs):null}; });

  if(rows[0].med!=null&&rows[1].med!=null) dgLine(id,`${Math.abs(rows[0].med-rows[1].med)<0.003?'✓':'✗'} two passes on one track line up within ${(Math.abs(rows[0].med-rows[1].med)*1000).toFixed(1)} ms`);
  const all=rows.filter(r=>r.med!=null).map(r=>r.med); if(all.length){ const m=medOf(all); DG.printOff=m; dgLine(id,`· prints land ${(m*1000).toFixed(1)} ms after the reported position (playback against recording; not applied)`); }
  // a cue jump

  const c=ses.cues[1]; if(c!=null){ await tpCue(1); const q=(await tpPosNow())/1000, d=q-c; dgLine(id,`${d>=-0.03&&d<=0.25?'✓':'✗'} cue for B: set for ${c.toFixed(3)} s, the tape stopped at ${q.toFixed(3)} s (${Math.round(d*1000)} ms after it; the held note plays briefly)`); } else dgLine(id,'✗ no cue for B was set');

// ------------------------------------------------------------------ test 4: sending the song, per track (A) or in one pass (C, B)
// The test song: sections A and B, 2 bars at 120 bpm; on every track two layers (beats 1, 3, 5, 7 and 2, 4, 6, 8), so each track has a
// click on every beat. The tracks differ in pitch (guitar 1 kHz, synth 1.5 kHz, drums 2 kHz) and sit 0, 125 and 250 ms after the beat,
// so one playback tells them apart even if the USB return mixes them.
const T4F={gtr:1000,syn:1500,drm:2000}, T4O={gtr:0,syn:0.125,drm:0.25}, T4N={gtr:'guitar (track 1)',syn:'synth (track 2)',drm:'drums (track 3)'};
function t4Song(){ const ses=S.ses, L=2*barS(), sr=ctx.sampleRate; ses.tg={gtr:1,syn:1,drm:1};
  ses.secs=[0,1].map(k=>({id:uid(),name:LETTERS[k],bars:2,L,s:TAPE0+k*L,bpm:ses.bpm,layers:[]}));
  for(const sec of ses.secs) for(const t of ['gtr','syn','drm']) for(const beats of [[0,2,4,6],[1,3,5,7]]){ const l=newLayer(t); l.state='accepted'; l.gain=1; const y=clickLayer(beats,T4F[t],L,T4O[t]);
    E.bufs.set(l.id,mkBuf(y,Math.round(L*sr))); l.env=envOf(y,160); if(t==='drm') l.hits=beats.map(b=>[b*beatS()+T4O[t],1,0.9]); sec.layers.push(l); }
  ses.cues={}; ses.cur=0; save(); renderAll(); return L; }
// one track's layers as a single buffer from section A's start, each section at its place (turned down as a whole if it would clip)
async function stemOf(t){ const secs=S.ses.secs; for(let k=0;k<secs.length;k++) await ensureBufs(k); const sr=ctx.sampleRate, s0=secs[0].s, end=secs.reduce((a,x)=>Math.max(a,x.s+x.L),0), N=Math.round((end-s0)*sr)+1, y=new Float32Array(N); let any=false;
  for(const sec of secs){ const o=Math.round((sec.s-s0)*sr), M=Math.round(sec.L*sr); for(const l of sec.layers){ if(l.type!==t||l.state!=='accepted') continue; const b=E.bufs.get(l.id); if(!b) continue; any=true; const d=b.getChannelData(0), g=gainOf(l), K=d.length;
      if(K===M) for(let i=0;i<M&&o+i<N;i++) y[o+i]+=d[i]*g; else for(let i=0;i<M&&o+i<N;i++) y[o+i]+=d[Math.min(K-1,Math.floor(i*K/M))]*g; } }
  let pk=0; for(let i=0;i<N;i++){ const a=y[i]<0?-y[i]:y[i]; if(a>pk) pk=a; } if(pk>0.78){ const g=0.78/pk; for(let i=0;i<N;i++) y[i]*=g; }
  return any?{t,y,pk,len:(N-1)/sr}:null; }
// the app's output as three USB pairs (USB 1 = channels 1-2, USB 2 = 3-4, USB 3 = 5-6), each stem on both channels of its pair
function multiOut(){ const d=ctx.destination; if(d.maxChannelCount<6) return null; const was={c:d.channelCount,i:d.channelInterpretation};
  try{ d.channelCount=6; d.channelInterpretation='discrete'; const mg=ctx.createChannelMerger(6); mg.connect(d); const g=[0,1,2].map(p=>{ const n=ctx.createGain(); n.connect(mg,0,2*p); n.connect(mg,0,2*p+1); return n; }); return {was,mg,g}; }catch(e){ log('err','6 outputs: '+(e&&e.message||e)); return null; } }
function multiOutEnd(o){ if(!o) return; try{ o.g.forEach(n=>n.disconnect()); o.mg.disconnect(); const d=ctx.destination; d.channelCount=o.was.c; d.channelInterpretation=o.was.i; }catch(e){} }
// C and B: a new TP-7 recording in normal mode, with stems on USB pairs (routes [[stem, pair]]), timed by the position reports before section A
async function sendOnePass(routes,lenS){ await tpUnperform(); mNow([0xB0,17,0]); mNow(sxMsg(SXOP.stop)); await sleep(150);
  const ed=await tpSetEdit(false); if(ed.after!==0xff) return {err:'Normal mode did not come on.'};
  const out=multiOut(); if(!out) return {err:'The phone gives the app fewer than 6 output channels.'};
  try{ if(!(await tpArm(true))) return {err:'The TP-7 did not arm.'}; const P0=await startPass(), tag='send';
    if(!(await waitFor(()=>posFit(P0,0).n>=3,4000,10))){ mNow(sxMsg(SXOP.stop)); mNow([0xB0,14,0]); return {err:'No position reports while recording.'}; }
    await waitFor(()=>{ const f=posFit(P0,0); return f.n>=8||f.c+TAPE0*1000-performance.now()<300; },3000,10);
    const fit=posFit(P0,0), tP=p=>fit.c+p*1000, g0=p2h(tP(TAPE0)+(S.tp.printFix||0)); if(g0<ctx.currentTime+0.04){ mNow(sxMsg(SXOP.stop)); mNow([0xB0,14,0]); return {err:'Too little lead-in before section A.'}; }
    for(const [st,pair] of routes){ const src=ctx.createBufferSource(); src.buffer=mkBuf(st.y,st.y.length); src.connect(out.g[pair]); src.start(g0); }
    const offP=TAPE0+lenS+0.25; midiSendPerf(sxMsg(SXOP.stop),tP(offP),tag); midiSendPerf([0xB0,14,0],tP(offP)+50,tag);
    await sleep(Math.max(0,tP(offP)+400-performance.now())); await waitFor(()=>TP.arm&&TP.arm.v===0,800,10);
    const f=await tpFileNow(); return {fit,file:f}; }
  finally{ multiOutEnd(out); } }
// C's second pass: one stem onto one track in edit mode from USB 1, from the start: an unarmed run-up for the reports, armed just before A
async function sendTrackPass(st,track,lenS){ await tpUnperform(); mNow([0xB0,17,0]); mNow(sxMsg(SXOP.stop)); await sleep(150);
  const r=await tpEditTo(track,TPIN.usb1); if(r) return {err:r}; if(!(await tpToStart())) return {err:'The tape did not go back to the start.'};
  const P0=await startPass(), tag='send'; if(!(await waitFor(()=>posFit(P0,0).n>=3,4000,10))){ mNow(sxMsg(SXOP.stop)); return {err:'No position reports.'}; }
  await waitFor(()=>{ const f=posFit(P0,0); return f.n>=8||f.c+TAPE0*1000-performance.now()<300; },3000,10);
  const fit=posFit(P0,0), tP=p=>fit.c+p*1000, g0=p2h(tP(TAPE0)+(S.tp.printFix||0)); if(g0<ctx.currentTime+0.04){ mNow(sxMsg(SXOP.stop)); return {err:'Too little lead-in before section A.'}; }
  midiSendPerf([0xB0,14,127],tP(TAPE0-0.15),tag); const src=ctx.createBufferSource(); src.buffer=mkBuf(st.y,st.y.length); src.connect(A.print); src.start(g0);
  const offP=TAPE0+lenS+0.25; midiSendPerf([0xB0,14,0],tP(offP),tag); midiSendPerf(sxMsg(SXOP.stop),tP(offP+0.3),tag);
  await sleep(Math.max(0,tP(offP+0.6)-performance.now())); if(!(await waitFor(()=>TP.arm&&TP.arm.v===0,800,10))){ mNow([0xB0,14,0]); await sleep(200); } return {fit}; }
// play the recording from the start (edit mode, the given track selected, not armed) and place every click of every track by the reports
async function t4Play(track,lenS){ await tpUnperform(); await tpEditTo(track,TPIN.line1); await tpToStart(); const P0=performance.now(), g0=ctx.currentTime; mNow(sxMsg(SXOP.play));
  await sleep((TAPE0+lenS+0.8)*1000); mNow(sxMsg(SXOP.stop)); const fit=posFit(P0,0), ts=clicksIn(g0,ctx.currentTime-0.1); if(!fit.n) return null;
  const cl=ts.map(t=>({p:(h2p(t-RT())-fit.c)/1000,f:clickHz(t)})), res={};
  for(const t of ['gtr','syn','drm']){ const offs=[]; for(const sec of S.ses.secs) for(let b=0;b<8;b++){ const want=sec.s+b*sec.L/8+T4O[t], c=cl.find(c=>c.f===T4F[t]&&Math.abs(c.p-want)<0.06); if(c) offs.push(c.p-want); }

// listen to one run: the first time also finds out what the USB return carries (all tracks, the selected one, or track 1 only)
async function t4Listen(id,lenS){ const out={}; const take=(r,ts)=>ts.forEach(t=>{ if(r&&r.res[t].n) out[t]=r.res[t]; });
  const rr=await rtRemeasure(); dgLine(id,rr?`  · round trip now ${msTxt(rr.rt)}${rr.was!=null?` (was ${msTxt(rr.was)})`:''}`:'  · round trip not measured; the last one is used');
  banner('Listen: the TP-7 plays it back','Guitar low, synth middle, drums high: three clicks on every beat.'); const r1=await t4Play(0,lenS); banner(''); if(!r1){ dgLine(id,'  ✗ no position reports during playback'); return out; }
  if(DG.ret==null){ if(r1.res.syn.n||r1.res.drm.n) DG.ret='mix'; else { const r2=await t4Play(1,lenS); DG.ret=r2&&r2.res.syn.n?'selected':'track1'; take(r2,['syn']); }
    dgLine(id,`  · the app hears ${DG.ret==='mix'?'every track at once':DG.ret==='selected'?'the selected track':'track 1 only'} when the TP-7 plays back${DG.ret==='track1'?' (tracks 2 and 3 cannot be measured; listen to them)':''}`); }

  for(const t of ['gtr','syn','drm']){ const r=out[t]; if(r) dgLine(id,`  ${r.n===r.of?'✓':'✗'} ${T4N[t]}: ${r.n} of ${r.of} clicks, ${(r.med*1000).toFixed(1)} ms from where the reports place them (spread ${(r.sp*1000).toFixed(1)} ms)`);

// ------------------------------------------------------------------ test 3: a real loop, start to finish, with your footswitch

// the live synth run here over a recording: per attack, how long until a voice starts that was not sounding before it
function liveRun(x,sr){ const Lv=new G.Live(sr,{preset:S.synth.preset,prof:S.synth.prof,bleed:0}); Lv.log=[]; const out=new Float32Array(128), T=[]; let tot=0,nb=0,worst=0;
  for(let i=0;i+128<=x.length;i+=128){ const n0=Lv.log.length, a=performance.now(); Lv.feed(x.subarray(i,i+128),128,out); const d=performance.now()-a; tot+=d; nb++; if(i>sr&&d>worst) worst=d; for(let k=n0;k<Lv.log.length;k++) T.push((i+128)/sr); }
  const dec=new G.Decim(sr,12000), y=new Float32Array(Math.ceil(x.length/dec.D)+8), ny=dec.run(x,x.length,y,0), on=G.onsets(y.subarray(0,ny),dec.sr), lat=[];
  for(const a of on){ const k0=T.findIndex(t=>t>=a.t); if(k0<0) continue; const before=new Set(k0>0?Lv.log[k0-1].map(v=>v[0]):[]);

  lat.sort((p,q)=>p-q); const q=f=>lat.length?Math.round(lat[Math.min(lat.length-1,Math.floor(lat.length*f))]):'n/a';
  return {med:q(0.5),p90:q(0.9),found:lat.length,n:on.length,blk:(tot/Math.max(1,nb)).toFixed(3),worst:worst.toFixed(2),bud:(128/sr*1000).toFixed(2)}; }

// ------------------------------------------------------------------ build 11: capture song ideas quickly (after Loopy Pro and Otis McLooper)
// Loopy Pro records the whole session as you play (Session Recording), undoes and redoes layers one at a time (loop peel), can keep
// what you just played without having pressed record (Retrospective Recording), and closes loops by count-out. Otis McLooper records
// a set number of bars and loops them, one press. Here:
// - Capture (the default): the TP-7 records while you play, in normal mode: track 1 your guitar from line 1, track 2 what you hear
//   (USB 1, with the metronome), track 3 the loops and pads without the metronome (USB 2). Nothing to print, nothing to wait for.
//   It rolls from your first loop or Play and stops when you stop; each play-through is one TP-7 recording.
// - Every layer is kept. Switch 6 while looping: one tap undoes the newest layer, two taps bring it back.
// - Switch 1 twice quickly keeps what you just played: the last time round (or, before the first loop, the last bars).
// - Loop length: free (switch 1 closes it) or 1, 2, 4 or 8 bars (one press makes the loop; a layer then records one time round).
const capOn=()=>S.mode!=='arrange'&&!E.forceArr;
// the tape: Start Session then Play while armed in normal mode makes a new recording of the record sources (line 1, USB 1, USB 2)
// build 13: Play alone on the press. Start Session went out when the TP-7 was last armed (tpPerform, capStop), so the 80 ms between
// Start Session and Play is gone. Not tested on the TP-7 (Test 5 always sent Start Session 80 ms before Play): capStop logs an error
// if a take gives no new file, and the phone test 4 checks it. Play waits for the re-arm after a Stop, and keeps 250 ms after Stop
// (HANDOFF safety rule: messages too close together leave the tape stopped).
function capStart(why){ if(!capOn()||E.cap||tpProblem()) return; if(!TP.perf&&!E.capJob) return;
  const c={why,press:E.pressT!=null?E.pressT:performance.now(),p0:null,known:null}; E.cap=c;
  (async()=>{ if(E.capJob){ log('st','TP-7: Play waits for the re-arm after the last Stop'); await E.capJob; } if(E.cap!==c) return;
    if(!TP.perf){ E.cap=null; log('err','TP-7 not armed: this take is not on the TP-7'); say('The TP-7 is not armed: this take is only in the app.'); renderAll(); return; }
    const w=(TP.stopAt||-1e9)+255-performance.now(); if(w>0){ log('st',`TP-7: Play held ${Math.round(w)} ms (250 ms after Stop, plus 5 ms for the MIDI queue)`); await sleep(w); if(E.cap!==c) return; }
    c.known=TP.file&&TP.file.path; TP.firstM=null; c.p0=TP.playAt=performance.now(); mNow(sxMsg(SXOP.play));
    log('t4',`TP-7 recording started (${why}): Play sent ${Math.round(c.p0-c.press)} ms after the press`); renderAll(); })();
  renderAll(); }
// build 13 (build 12's fix, measured in Test 5 on 26 Nov): Stop while armed leaves the file open; the disarm closes it and its K
// notice follows. So: Stop, 150 ms (the shortest gap tested, 15 of 15 takes gave their own file; build 12 had 250 ms), disarm, wait
// for armed = 0 and a K notice for a file other than the one before the take, then arm again so the guitar reaches the app, and Start
// Session so the next take needs only Play. Stop to re-armed was 198 to 210 ms in Test 5.
const CAP_GAP=150;

  log('st',`TP-7 recording stopped: ${secs.toFixed(1)} s`); renderAll();
  const job=(async()=>{ TP.perf=false; await sleep(CAP_GAP); const tD=performance.now(); mNow([0xB0,14,0]);
    const a0=await waitFor(()=>TP.arm&&TP.arm.v===0&&TP.arm.t>=tD,1500,5), tA0=performance.now();
    const isNew=()=>TP.file&&TP.file.t>=tD&&TP.file.path!==c.known; let f=(await waitFor(isNew,1000,5))?TP.file:null, via='after the disarm';
    if(!f){ TP.file=null; await tpSession(); f=(await waitFor(()=>TP.file&&TP.file.path!==c.known,1000,5))?TP.file:null; via='from Start Session'; }
    const tR=performance.now(); mNow([0xB0,14,127]); const a1=await waitFor(()=>TP.arm&&TP.arm.v===1&&TP.arm.t>=tR,1500,5);
    if(a1){ await tpSession(); TP.perf=true; } else log('err','TP-7 did not report armed again after the take');
    log('t5',`close and re-arm: Stop to armed = 0 ${a0?Math.round(tA0-tS)+' ms':'not seen'}, file ${f?via:'none new'}, Stop to armed again ${a1?Math.round(performance.now()-tS)+' ms':'not seen'}`);
    if(!f){ log('err','no new TP-7 file for this take (Play alone may not start a new recording)'); say('The TP-7 reported no new recording for this take.','Copy the log into our chat.'); return; }

    (S.ses.caps=S.ses.caps||[]).push({file:f.path,secs:Math.round(secs*10)/10,at:Date.now()}); save();
    say(`On the TP-7: ${f.path.split('/').pop()} (${fmtS(secs)}).`,f.b9<3?`It has ${f.b9} track${f.b9>1?'s':''}: set the TP-7's record sources to line 1, USB 1 and USB 2 once.`:'Track 1 your guitar, 2 what you heard, 3 the loops without the metronome.'); })();
  E.capJob=job; try{ await job; } finally{ if(E.capJob===job) E.capJob=null; renderAll(); } }
const fmtS=s=>`${Math.floor(s/60)}:${String(Math.round(s%60)).padStart(2,'0')}`;
// the loops and pads alone (no metronome, no count-in, no live synth) on USB 2, beside what you hear on USB 1
function cleanBus(){ if(A.clean||!ctx) return; const d=ctx.destination; A.clean=ctx.createGain();
  if(d.maxChannelCount<4){ log('st','2 output channels only: the loops without the metronome cannot go to USB 2'); return; }
  try{ d.channelCount=Math.min(6,d.maxChannelCount); d.channelInterpretation='discrete'; const mg=ctx.createChannelMerger(d.channelCount), s1=ctx.createChannelSplitter(2), s2=ctx.createChannelSplitter(2), cl=ctx.createWaveShaper(); cl.curve=softCurve();
    A.clip.disconnect(); A.clip.connect(s1); s1.connect(mg,0,0); s1.connect(mg,1,1); A.clean.connect(cl); cl.connect(s2); s2.connect(mg,0,2); s2.connect(mg,1,3); mg.connect(d);
    A.cleanMg=mg; capRoute(); }
  catch(e){ log('err','clean bus: '+(e&&e.message||e)); try{ A.clip.connect(d); }catch(_){} } }
// the newest layer of the playing section that still sounds
function peelUndo(){ const P=E.play, sec=P&&SEC(P.k); if(!sec) return; const l=sec.layers.filter(x=>x.state==='accepted'&&!x.muted).sort((a,b)=>(b.created||0)-(a.created||0))[0];
  if(!l){ say('Nothing left to undo in this section.'); return; } l.muted=true; l.peeled=true; layerGain(l); (E.redo=E.redo||[]).push({id:l.id,k:P.k}); save();
  log('st',`undo: ${TNAME[l.type]} on ${sec.name}`); say(`Undone: the ${TNAME[l.type].toLowerCase()} layer.`,'Tap switch 6 twice to bring it back.'); renderAll(); }
function peelRedo(){ const r=(E.redo||[]).pop(); const sec=r&&SEC(r.k), l=sec&&sec.layers.find(x=>x.id===r.id); if(!l){ say('Nothing to bring back.'); return; }
  l.muted=false; l.peeled=false; layerGain(l); save(); log('st',`redo: ${TNAME[l.type]} on ${sec.name}`); say(`Back: the ${TNAME[l.type].toLowerCase()} layer.`); renderAll(); }
// switch 1 twice within 0.4 s: what you just played becomes the loop (or the layer) instead of what the first press started
async function retro(h){ const r=E.rec; if(!r) return false; const t0=r.first?r.S0:r.h0; if(h-t0<1.5) log('t8',`switch 1 again ${Math.round((h-t0)*1000)} ms after the last (keep window 400 ms)`); if(h-t0>0.4) return false;
  if(r.first){ firstCancel(); E.cancelled=false; const bar=barS(), n=S.len||4; let e1=h;
    if(CLK.on&&CLK.z0!=null){ const bl=CLK.z0+Math.floor((h+0.12-CLK.z0)/bar)*bar; if(bl>h-bar) e1=bl; }
    const s0=e1-n*bar; if(!IN.ring||s0<IN.w/IN.sr-80){ say('Nothing kept: the app holds the last 80 s.'); return true; }
    log('st',`retrospective: the last ${n} bars (${(n*bar).toFixed(2)} s) to ${e1.toFixed(2)}`); E.rec={first:true,S0:s0,via:'retro',hits:[]}; E.st='first'; E.play=null; await firstClose(e1); return true; }
  const P=E.play; if(!P) return false; E.rec=null; const c=P.z+Math.floor((h-P.z)/P.L)*P.L; if(c-P.L<P.z){ say('Nothing kept: no whole time round yet.'); prevSync(); return true; }
  log('st',`retrospective: the last time round (${(c-P.L).toFixed(2)} to ${c.toFixed(2)})`); E.rec={first:false,h0:c-P.L,k:P.k,z:P.z,L:P.L,hits:[],retro:true}; await layerStop(c); return true; }
// the loops and pads: always to USB 2; to USB 1 too unless the TP-7 lets you hear USB 2 (test 6), so you never hear them twice
function capRoute(){ if(!A.clean||!A.cleanMg) return; try{ A.loop.disconnect(); A.pads.disconnect(); }catch(e){}
  A.loop.connect(A.clean); A.pads.connect(A.clean); if(!S.tp.mon2){ A.loop.connect(A.mon); A.pads.connect(A.mon); }
  log('st',`outputs: ${S.tp.mon2?'the metronome and live synth on USB 1, the loops and pads on USB 2':'what you hear on USB 1, the loops and pads alone on USB 2 too'}`); }
